<title>قائمة مهامي</title>

<link rel="stylesheet" href="style.css">
<div class="container">

    <h1>قائمة مهامي 📝</h1>
    <p>نظّم يومك وأنجز مهامك بسهولة</p>

    <div class="input-box">
        <input 
            type="text" 
            id="taskInput" 
            placeholder="اكتب مهمة جديدة..."
        >

        <button id="addTask">
            إضافة
        </button>
    </div>

    <div class="filters">
        <button class="filter active" data-filter="all">
            الكل
        </button>

        <button class="filter" data-filter="completed">
            مكتملة
        </button>

        <button class="filter" data-filter="pending">
            غير مكتملة
        </button>
    </div>

    <ul id="taskList"></ul>

    <div class="empty-message" id="emptyMessage">
        لا توجد مهام حاليًا ✨
    </div>

</div>

<script src="script.js"></script>
